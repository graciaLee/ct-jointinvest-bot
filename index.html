<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>대테러 합동조사 Q&A 챗봇</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "맑은 고딕", sans-serif;
      background: #0f172a;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #e5e7eb;
    }
    .chat-container {
      width: 100%;
      max-width: 520px;
      height: 90vh;
      background: #020617;
      border-radius: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header-title {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }
    .chat-header h1 {
      font-size: 1rem;
      margin: 0;
    }
    .chat-header p {
      font-size: 0.75rem;
      margin: 0;
      color: #9ca3af;
    }
    .logout-button {
      font-size: 0.7rem;
      border-radius: 999px;
      border: 1px solid #374151;
      padding: 0.35rem 0.75rem;
      background: #020617;
      color: #9ca3af;
      text-decoration: none;
    }
    #chat-log {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .message {
      max-width: 80%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.85rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end;
      background: #1d4ed8;
      border-bottom-right-radius: 0.1rem;
    }
    .message.bot {
      align-self: flex-start;
      background: #111827;
      border-bottom-left-radius: 0.1rem;
    }
    .chat-input {
      padding: 0.75rem;
      border-top: 1px solid #1f2937;
      display: flex;
      gap: 0.5rem;
      background: #020617;
    }
    .chat-input input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #374151;
      padding: 0.5rem 0.75rem;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.9rem;
      outline: none;
    }
    .chat-input button {
      border-radius: 999px;
      border: none;
      padding: 0 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      background: #2563eb;
      color: white;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .chat-input button:active {
      transform: translateY(1px);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.5);
    }

    /* ===== 체크리스트 UI ===== */
    .cl-card{
      border:1px solid #1f2937;
      padding:12px;
      border-radius:12px;
      background:#0b1220;
      margin:6px 0;
    }
    .cl-title{font-weight:700;margin-bottom:6px}
    .cl-desc{font-size:12px;color:#9ca3af;margin-bottom:10px}
    .cl-rule{font-size:12px;margin:10px 0;color:#e5e7eb}
    .cl-grid{display:flex;flex-wrap:wrap;gap:8px}
    .cl-opt{
      padding:8px 10px;
      border:1px solid #374151;
      border-radius:999px;
      background:#020617;
      color:#e5e7eb;
      cursor:pointer;
      font-size:12px;
    }

    .cl-table-wrap{overflow-x:visible;}
    .cl-table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:0;}
    .cl-table th,.cl-table td{border:1px solid #1f2937;padding:8px;vertical-align:top}
    .cl-table th{background:#0f172a;font-size:12px;color:#cbd5e1}
    .cl-table td{font-size:12px;color:#e5e7eb}

    .c1{width:90px;font-weight:700}
    .c2{width:auto;color:#cbd5e1;word-break:break-word;white-space:normal}
    .c3{width:150px}

    .cl-lv{display:inline-flex;align-items:center;gap:4px;margin-right:6px;font-size:12px}
    .cl-lv input{transform:scale(0.95)}

    .cl-actions{margin-top:10px}
    .cl-submit{
      padding:8px 12px;
      border:1px solid #2563eb;
      border-radius:999px;
      background:#2563eb;
      color:#fff;
      cursor:pointer;
      font-size:12px;
      font-weight:600;
    }
    .cl-result{
      margin-top:10px;
      padding:10px;
      border-radius:10px;
      border:1px solid #1f2937;
      background:#020617;
    }
    .cl-r-title{font-weight:700;margin-bottom:6px}
    .cl-r-decision{margin-top:8px;font-size:14px}

    /* ===== 좁은 화면: 표 → 카드형 변환(횡스크롤 제거 핵심) ===== */
    @media (max-width: 520px) {
      .cl-table-wrap{overflow-x:visible !important;}
      .cl-table, .cl-table thead, .cl-table tbody, .cl-table th, .cl-table td, .cl-table tr{
        display:block;
        width:100%;
      }
      .cl-table thead{display:none;}
      .cl-table tr{
        border:1px solid #1f2937;
        border-radius:12px;
        background:#020617;
        margin-bottom:10px;
        overflow:hidden;
      }
      .cl-table td{
        border:none;
        border-bottom:1px solid #1f2937;
        padding:10px;
      }
      .cl-table td:last-child{border-bottom:none;}

      .cl-table td.c1{
        font-weight:800;
        color:#e5e7eb;
        background:#0b1220;
      }
      .cl-table td.c2{color:#cbd5e1;}
      .cl-table td.c3{
        display:flex;
        flex-wrap:wrap;
        gap:10px;
        align-items:center;
      }
      .cl-lv{
        margin-right:0;
        background:#0b1220;
        border:1px solid #1f2937;
        padding:6px 10px;
        border-radius:999px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="chat-header-title">
        <h1>대테러 합동조사 Q&A</h1>
        <p>“언제 합동조사를 해야 하나요?” 같이 질문해보세요.</p>
      </div>
      <a href="/logout" class="logout-button">로그아웃</a>
    </header>
    <main id="chat-log"></main>
    <form id="chat-form" class="chat-input">
      <input id="user-input" autocomplete="off" placeholder="질문을 입력하세요..." />
      <button type="submit">전송</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
